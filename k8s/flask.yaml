apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: bandarurishitha/flask-ims:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_USER
          value: "incident_user"
        - name: DB_PASSWORD
          value: "incident_pass"
        - name: DB_NAME
          value: "incident_db"
        - name: DB_HOST
          value: "mysql-service"
        - name: GEMINI_API_KEY
          value: "AIzaSyA4Le27cVzU6wnYp-D5mlseZPKaK3Lglxs"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        command: ["gunicorn"]
        args: ["--bind", "0.0.0.0:5000", "app:app", "--workers", "2", "--timeout", "120"]
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: ClusterIP
  selector:
    app: flask-app
  ports:
  - port: 5000
    targetPort: 5000